<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Snake</title>
        <style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0E1116; color: #E8ECF1; font-family: Inter, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; overflow: hidden; }
  #canvas { display: block; width: min(100%, calc((100vh - 84px) * 1.2268)) !important; height: auto !important; aspect-ratio: 768 / 626; background: #0F0F14; outline: none; }
  #hint { margin: 0; font-size: 14px; line-height: 1.2; color: #9AA4B2; text-align: center; padding: 0 8px; }
  #pad { display: flex; gap: 6px; }
  #pad button { min-width: 44px; height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid #2A313C; background: #161B22; color: #E8ECF1; font: inherit; font-size: 15px; cursor: pointer; touch-action: manipulation; }
  #pad button:hover { border-color: #4D7CFF; }
  #pad button:focus-visible { outline: 2px solid #4D7CFF; outline-offset: 2px; }
</style>
    </head>
    <body>
        <canvas id="canvas" tabindex="-1"
            oncontextmenu="event.preventDefault()"></canvas>
        <div id="pad" role="group" aria-label="On-screen controls">
            <button type="button" data-key="ArrowLeft"
                aria-label="Left">&larr;</button>
            <button type="button" data-key="ArrowUp"
                aria-label="Up">&uarr;</button>
            <button type="button" data-key="ArrowDown"
                aria-label="Down">&darr;</button>
            <button type="button" data-key="ArrowRight"
                aria-label="Right">&rarr;</button>
            <button type="button" data-key="KeyP">Pause</button>
            <button type="button" data-key="Enter">Restart</button>
        </div>
        <p id="hint" role="status">Loading...</p>
        <script>
  var DEFAULT_HINT = "Arrow keys or WASD to move. P pauses. Enter restarts after game over.";
  var KEYS = {
    ArrowLeft: { key: "ArrowLeft", keyCode: 37 },
    ArrowUp: { key: "ArrowUp", keyCode: 38 },
    ArrowRight: { key: "ArrowRight", keyCode: 39 },
    ArrowDown: { key: "ArrowDown", keyCode: 40 },
    KeyP: { key: "p", keyCode: 80 },
    Enter: { key: "Enter", keyCode: 13 }
  };

  // Stop the page from scrolling when the arrow keys are used.
  window.addEventListener("keydown", function (e) {
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].indexOf(e.key) !== -1) e.preventDefault();
  }, { passive: false });

  // On-screen buttons send the same key events as a keyboard.
  Array.prototype.forEach.call(document.querySelectorAll("#pad button"), function (btn) {
    btn.addEventListener("pointerdown", function (ev) {
      ev.preventDefault();
      var code = btn.getAttribute("data-key");
      var k = KEYS[code];
      var init = { key: k.key, code: code, keyCode: k.keyCode, which: k.keyCode, bubbles: true, cancelable: true };
      window.dispatchEvent(new KeyboardEvent("keydown", init));
      setTimeout(function () { window.dispatchEvent(new KeyboardEvent("keyup", init)); }, 60);
    });
  });

  var Module = {
    canvas: document.getElementById("canvas"),
    print: function () {},
    printErr: function (t) { console.warn(t); },
    setStatus: function (text) { document.getElementById("hint").textContent = text || DEFAULT_HINT; },
    preRun: [function () {
      // Keep the high score in the visitor's browser (IndexedDB).
      try {
        var fs = (typeof FS !== "undefined") ? FS : Module.FS;
        var idb = (typeof IDBFS !== "undefined") ? IDBFS : Module.IDBFS;
        fs.mkdir("/persist");
        fs.mount(idb, {}, "/persist");
        Module.addRunDependency("persist");
        fs.syncfs(true, function () { Module.removeRunDependency("persist"); });
      } catch (e) {
        console.warn("High score will not be saved in this browser.", e);
      }
    }]
  };
  document.getElementById("canvas").addEventListener("pointerdown", function () { window.focus(); });
</script>
        {{{ SCRIPT }}}
    </body>
</html>
